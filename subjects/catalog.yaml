    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/Authoring#64
    interaction: request_reply
    request: runtime.v1.TaskStateChangeRequest
    replies:
      success: service.v1.Response
      failure: service.v1.Response
