# yaml-language-server: $schema=./catalog.schema.json
version: 1

# The initial inventory is intentionally staged while the hand-written helpers
# in each consumer are reconciled with this catalog.
conformance:
  mode: staged
  tracking_issue: cobotar/protocol#11

components:
  - authoring
  - web_cobotar
  - holo_cobotar
  - fusion360_exporter

routes:
  - id: command.robot.visibility
    pattern: command.robot.visibility.{robot_instance_id}
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: publish
    payload: robot.v1.RobotVisibilityMessage
    parameters:
      robot_instance_id:
        type: subject_token
    publishers: [web_cobotar]
    consumers: [holo_cobotar]
    description: Show or hide parts of a robot in AR clients.

  - id: command.storage.clear
    pattern: command.storage.clear
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#21
    interaction: request_reply
    request: service.v1.StorageClearRequest
    replies:
      success: service.v1.Response
      failure: service.v1.Response
    publishers: [web_cobotar]
    consumers: [authoring]

  - id: command.storage.dump
    pattern: command.storage.dump
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#21
    interaction: request_reply
    request: service.v1.StorageDumpRequest
    replies:
      success: service.v1.StorageDumpResult
      failure: service.v1.Response
    publishers: [web_cobotar]
    consumers: [authoring]

  - id: command.storage.load
    pattern: command.storage.load
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#21
    interaction: request_reply
    request: service.v1.StorageLoadRequest
    replies:
      success: service.v1.Response
      failure: service.v1.Response
    publishers: [web_cobotar]
    consumers: [authoring]

  - id: command.task_run.progress
    pattern: command.task_run.progress
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: request_reply
    request: runtime.v1.TaskProgressUpdate
    replies:
      success: service.v1.Response
      failure: service.v1.Response
    publishers: [authoring, web_cobotar, holo_cobotar]
    consumers: [authoring]
    description: Report fine-grained progress for the task identified by the request payload.

  - id: edit.entity.reset
    pattern: edit.{entity}.reset.{child}
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: request_reply
    parameters:
      entity:
        type: subject_token
      child:
        type: subject_token
    publishers: [web_cobotar]
    consumers: [authoring]
    description: Reserved for the upcoming reset operation; request and reply types are not decided yet.

  - id: edit.model.add
    pattern: edit.model.add
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: request_reply
    request: resources.v1.ModelArtifact
    replies:
      success: service.v1.Response
      failure: service.v1.Response
    publishers: [fusion360_exporter, web_cobotar]
    consumers: [authoring]

  - id: edit.part_definition.add
    pattern: edit.part_definition.add
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: request_reply
    request: product.v1.PartDefinition
    replies:
      success: service.v1.Response
      failure: service.v1.Response
    publishers: [fusion360_exporter, web_cobotar]
    consumers: [authoring]

  - id: edit.product.add
    pattern: edit.product.add
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: request_reply
    request: product.v1.ProductDefinition
    replies:
      success: service.v1.Response
      failure: service.v1.Response
    publishers: [fusion360_exporter, web_cobotar]
    consumers: [authoring]

  - id: get.asset_adapter.info
    pattern: get.asset_adapter.info.{asset_instance_id}
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/Authoring#65
    interaction: request_reply
    empty_request: true
    replies:
      success: resources.v1.AssetAdapterInfoMessage
      failure: service.v1.Response
    parameters:
      asset_instance_id:
        type: subject_token
    publishers: [authoring, web_cobotar, holo_cobotar]
    consumers: [authoring]
    description: Request the connected adapter information for one asset instance.

  - id: get.asset_adapter_definition.all
    pattern: get.asset_adapter_definition.all
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/Authoring#65
    interaction: request_reply
    empty_request: true
    replies:
      success: resources.v1.AssetAdapterDefinitions
      failure: service.v1.Response
    publishers: [authoring, web_cobotar, holo_cobotar]
    consumers: [authoring]
    description: Request every built-in asset adapter definition.

  - id: get.asset_adapter_definition.one
    pattern: get.asset_adapter_definition.one
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/Authoring#65
    interaction: request_reply
    request: common.v1.GetMessage
    replies:
      success: resources.v1.AssetAdapterDefinition
      failure: service.v1.Response
    publishers: [authoring, web_cobotar, holo_cobotar]
    consumers: [authoring]
    description: Request one built-in asset adapter definition by id.

  - id: get.robot_adapter.info
    pattern: get.robot_adapter.info.{robot_instance_id}
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#14
    interaction: request_reply
    empty_request: true
    replies:
      success: robot.v1.RobotAdapterInfoMessage
      failure: service.v1.Response
    parameters:
      robot_instance_id:
        type: subject_token
    publishers: [authoring, web_cobotar, holo_cobotar]
    consumers: [authoring]
    description: Request the connected adapter information for one robot instance.

  - id: get.robot_adapter_definition.all
    pattern: get.robot_adapter_definition.all
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/Authoring#49
    interaction: request_reply
    empty_request: true
    replies:
      success: resources.v1.RobotAdapterDefinitions
      failure: service.v1.Response
    publishers: [authoring, web_cobotar, holo_cobotar]
    consumers: [authoring]
    description: Request every built-in robot adapter definition.

  - id: get.robot_adapter_definition.one
    pattern: get.robot_adapter_definition.one
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/Authoring#49
    interaction: request_reply
    request: common.v1.GetMessage
    replies:
      success: resources.v1.RobotAdapterDefinition
      failure: service.v1.Response
    publishers: [authoring, web_cobotar, holo_cobotar]
    consumers: [authoring]
    description: Request one built-in robot adapter definition by id.

  - id: get.storage.info
    pattern: get.storage.info
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#21
    interaction: request_reply
    empty_request: true
    replies:
      success: service.v1.StorageInfo
      failure: service.v1.Response
    publishers: [web_cobotar]
    consumers: [authoring]

  - id: plan.robot.path
    pattern: plan.robot.path.{robot_instance_id}.{plan_id}
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: publish
    payload: robot.v1.PathMessage
    parameters:
      robot_instance_id:
        type: subject_token
      plan_id:
        type: subject_token
    subscriptions:
      - name: for_robot
        parameters: [robot_instance_id]
    publishers: [authoring]
    consumers: [web_cobotar, holo_cobotar]

  - id: telemetry.robot.controller_status
    pattern: telemetry.robot.controller_status.{robot_instance_id}
    lifecycle: active
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: publish
    payload: robot.v1.RobotControllerStatusMessage
    parameters:
      robot_instance_id:
        type: subject_token
    publishers: [authoring]
    consumers: [web_cobotar, holo_cobotar]

  - id: telemetry.robot.end_effector
    pattern: telemetry.robot.end_effector.{robot_instance_id}
    lifecycle: planned
    conformance:
      mode: staged
      tracking_issue: cobotar/protocol#11
    interaction: publish
    payload: robot.v1.EndEffectorStateMessage
    parameters:
      robot_instance_id:
        type: subject_token
    publishers: [authoring]
    consumers: [holo_cobotar]
    description: Reserved for a future robot end-effector telemetry publisher.
