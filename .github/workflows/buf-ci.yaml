name: Buf CI
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  pull-requests: write

jobs:
  buf:
    name: Run Buf linter, format, breaking changes, and generate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run linter
        run: buf lint

      - name: Run format
        run: buf format

      - name: Checking breaking changes
        run: buf breaking --against "https://github.com/cobotar/protocol.git#branch=main"

      - name: Generate proto messages
        run: |
          buf generate
          python3 scripts/rewrite_python_imports.py
          python3 scripts/strip_doc_whitespace.py

      - name: Check generated Python package
        run: |
          python3 -m pip install --extra-index-url https://buf.build/gen/python -e .
          python3 scripts/test_python_package.py --runtime

      - name: Check generated NATS subject helpers
        run: |
          go test ./internal/subjectgen ./subjects
          go run ./cmd/subjectgen check
