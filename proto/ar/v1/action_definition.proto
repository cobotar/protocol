syntax = "proto3";
package ar.v1;

import "ar/v1/action.proto";
import "ar/v1/definition_status.proto";
import "ar/v1/execution_contract.proto";
import "buf/validate/validate.proto";
import "common/v1/property.proto";
import "resources/v1/resource_requirement.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.AR.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/ar/v1";

enum ActionGroup {
  ACTION_GROUP_UNSPECIFIED = 0;
  ACTION_GROUP_GENERAL = 1;
  ACTION_GROUP_ROBOT = 2;
  ACTION_GROUP_TASK = 3;
}

message ActionDefinition {
  option (buf.validate.message).cel = {
    id: "action_definition.resource_requirements.reference_resource_properties"
    message: "resource requirements must reference a compatible ROBOT or ASSET property template"
    expression:
      "this.resource_requirements.all(requirement, this.properties.exists(property, property.key == requirement.resource_property_key && "
      "((property.type == 10 && !has(requirement.requirement.asset_type) && (!has(requirement.requirement.command) || has(requirement.requirement.command.robot_command)) && (!has(requirement.requirement.telemetry) || has(requirement.requirement.telemetry.robot_telemetry))) || "
      "(property.type == 14 && !has(requirement.requirement.plan) && (!has(requirement.requirement.command) || has(requirement.requirement.command.asset_command)) && (!has(requirement.requirement.telemetry) || has(requirement.requirement.telemetry.asset_telemetry))))))"
  };
  option (buf.validate.message).cel = {
    id: "action_definition.signal_requirements.reference_signal_properties"
    message: "signal id property keys must reference a STRING or ENUM property template"
    expression: "this.resource_requirements.all(requirement, !has(requirement.requirement.signal) || !has(requirement.requirement.signal.signal_id_property_key) || this.properties.exists(property, property.key == requirement.requirement.signal.signal_id_property_key && (property.type == 5 || property.type == 11)))"
  };

  // Stable identity of this immutable built-in definition revision.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.action_definition_id_component) = true
  ];
  // Stable logical identity shared by every revision of this definition.
  string key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.key_component) = true
  ];
  string name = 3 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string icon = 4;
  string description = 5;
  ActionType type = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  ActionGroup group = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Monotonic revision of the externally visible definition contract.
  uint64 revision = 8 [(buf.validate.field).uint64.gte = 1];
  DefinitionStatus status = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  repeated common.v1.PropertyTemplate properties = 10 [(buf.validate.field).cel = {
    id: "action_definition.properties.unique_keys"
    message: "property template keys must be unique"
    expression: "this.map(property, property.key).unique()"
  }];
  reserved 11, 12;
  ExecutionContract execution = 13 [(buf.validate.field).required = true];
  repeated resources.v1.ConsumerResourceRequirement resource_requirements = 14;
}

// The catalog service additionally enforces that revisions sharing a key also
// share a type, and that at most one revision per key/type is ACTIVE.
message ActionDefinitions {
  repeated ActionDefinition items = 1 [
    (buf.validate.field).cel = {
      id: "action_definitions.items.unique_ids"
      message: "action definition ids must be unique"
      expression: "this.map(definition, definition.id).unique()"
    },
    (buf.validate.field).cel = {
      id: "action_definitions.items.unique_key_revisions"
      message: "action definition key and revision pairs must be unique"
      expression: "this.all(definition, this.filter(candidate, candidate.key == definition.key && candidate.revision == definition.revision).size() == 1)"
    }
  ];
}
