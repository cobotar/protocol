syntax = "proto3";
package ar.v1;

import "ar/v1/provenance.proto";
import "buf/validate/validate.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.AR.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/ar/v1";

enum FunctionType {
  FUNCTION_TYPE_UNSPECIFIED = 0;

  // -------------------------
  // Spatial evaluation (10–19)
  // -------------------------

  // Evaluates whether two spatial entities are within a configured distance.
  FUNCTION_TYPE_PROXIMITY = 10;

  // Evaluates whether a spatial entity is stationary.
  FUNCTION_TYPE_STATIONARY = 11;

  // -------------------------
  // Temporal evaluation (20–29)
  // -------------------------
  //
  // Durations are in milliseconds (cobotar/Authoring#7). A trigger acts on its rising edge (false to true), and its
  // falling edge does nothing; setting it to true again while it's true isn't an edge. A trigger that is already true
  // when the function is created counts as a rising edge.
  // A delayed or debounced output starts from its input's value when the function is created, without waiting.

  // Produces an active output for a configured duration after being triggered. A rising edge of `trigger` makes
  // `active` true for `duration`; a new rising edge while it's active restarts the duration.
  FUNCTION_TYPE_TIMER = 21;

  // Propagates a boolean input after a configured delay: a transport delay. Every transition of `input`, rising and
  // falling, reaches `output` `delay` after it happened, so `output` is `input` as it was `delay` ago, and a pulse
  // shorter than the delay is kept rather than swallowed (Debounce filters short pulses). A changed `delay` re-times
  // the waiting transitions too: each is due when it happened plus the new delay, and those already past that arrive
  // at once. Due times follow the order the transitions happened in, so they arrive in that order.
  // `pending` is true while a transition is waiting to reach `output`.
  FUNCTION_TYPE_DELAY = 22;

  // Indicates that an expected event did not occur within a configured duration. A rising edge of `trigger` starts
  // a window of `duration`, or restarts a running one, and clears `timed_out`. The window is satisfied, and ends,
  // when `expected_event` is true at any moment in it, including at its start. `waiting` is true while the window
  // runs. If it ends unsatisfied, `timed_out` becomes true and stays true until `expected_event` becomes true (the
  // late event) or a new trigger starts another window.
  FUNCTION_TYPE_TIMEOUT = 23;

  // Changes its output only after the input has remained stable for a configured duration. A change of `input`
  // reaches `output` once `input` has kept the new value for `duration`; a change back before then cancels it. One
  // duration applies to both edges. `pending` is true while `input` differs from `output`.
  FUNCTION_TYPE_DEBOUNCE = 24;

  // A stopwatch: reports the time accumulated while its run input is true. `elapsed_time` (milliseconds) grows while
  // `run` is true and keeps its value while `run` is false, so a later true resumes it. A rising edge of `reset`
  // sets it to zero, and it keeps running if `run` is true. `running` follows `run`.
  FUNCTION_TYPE_ELAPSED_TIME = 25;

  // Indicates whether the current time falls within a weekly schedule, in the device's local time. A window starts
  // at `start_time` on each of the selected `days` and ends at `end_time`, the start included and the end not. Times
  // are HH:MM, two-digit hours and minutes from 00:00 to 23:59. An end before the start ends on the next day, and an
  // end equal to the start makes the window 24 hours. `active` is true while `enabled` and inside a window.
  // `next_transition` is the local time of the next change of `active`, as an ISO 8601 date-time with its UTC
  // offset, or empty when there's none (disabled, no days, or an invalid time).
  FUNCTION_TYPE_SCHEDULE = 26;

  // -------------------------
  // Task and part lookup (40–59)
  // -------------------------

  // Resolves the part associated with a task.
  FUNCTION_TYPE_PART_FOR_TASK = 40;

  // Evaluates whether a part matches a specified part type.
  FUNCTION_TYPE_IS_PART_OF_TYPE = 50;

  // Resolves the closest task that is currently workable.
  FUNCTION_TYPE_CLOSEST_WORKABLE_TASK = 51;

  // -------------------------
  // String operations (60–69)
  // -------------------------

  // Formats a string using one replacement value.
  FUNCTION_TYPE_STRING_FORMAT_1 = 60;

  // Formats a string using two replacement values.
  FUNCTION_TYPE_STRING_FORMAT_2 = 61;

  // Evaluates whether a string is empty.
  FUNCTION_TYPE_STRING_EMPTY = 62;

  // -------------------------
  // Integer operations (70–79)
  // -------------------------

  // Formats an integer as a string.
  FUNCTION_TYPE_INT_FORMAT = 70;

  // Compares two integer values.
  FUNCTION_TYPE_INT_COMPARE = 71;

  // -------------------------
  // Float operations (80–89)
  // -------------------------

  // Formats a single-precision floating-point value as a string.
  FUNCTION_TYPE_FLOAT_FORMAT = 80;

  // Compares two single-precision floating-point values.
  FUNCTION_TYPE_FLOAT_COMPARE = 81;

  // -------------------------
  // Double operations (90–99)
  // -------------------------

  // Formats a double-precision floating-point value as a string.
  FUNCTION_TYPE_DOUBLE_FORMAT = 90;

  // Compares two double-precision floating-point values.
  FUNCTION_TYPE_DOUBLE_COMPARE = 91;

  // -------------------------
  // Logical operations (100–119)
  // -------------------------

  // Evaluates the logical conjunction of two boolean values.
  FUNCTION_TYPE_AND = 100;

  // Evaluates the logical disjunction of two boolean values.
  FUNCTION_TYPE_OR = 101;

  // Negates a boolean value.
  FUNCTION_TYPE_NOT = 102;

  // -------------------------
  // Robot (120–139)
  // -------------------------

  // Reads a configured robot input.
  FUNCTION_TYPE_ROBOT_CONFIGURABLE_INPUT = 120;

  // Reads a configured robot output.
  FUNCTION_TYPE_ROBOT_CONFIGURABLE_OUTPUT = 121;

  // Outputs the anchor of one of a robot's frames (e.g. its base, end effector or tool center point), following the
  // robot that its robot property resolves to.
  FUNCTION_TYPE_ROBOT_ANCHOR = 122;

  // Outputs a robot's state (robot.v1.RobotState).
  FUNCTION_TYPE_ROBOT_STATE = 123;
}

message FunctionMessage {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.function_id_component) = true
  ];
  string name = 2 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string icon = 3;
  string description = 4;
  string function_definition_id = 5 [ // Pins the exact immutable FunctionDefinition revision used by this instance.
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.function_definition_id_component) = true
  ];
  string config_id = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.ar_config_id_component) = true
  ];
  ARContentProvenance provenance = 7 [(buf.validate.field).required = true];
}

message FunctionMessages {
  repeated FunctionMessage items = 1;
}

message FunctionAddMessage {
  string config_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.ar_config_id_component) = true
  ];
  string name = 2 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string icon = 3;
  string description = 4;
  string function_definition_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.function_definition_id_component) = true
  ];
  string robot_property_id = 6 [(buf.validate.field).string.(validation.v1.property_definition_id_component) = true]; // If the function uses a robot, this should point to a property definition of type ROBOT, e.g. a robot input slot's property, which the function's robot property then mirrors
}

message FunctionUpdateMessage {
  string id = 1 [(buf.validate.field).string.(validation.v1.function_id_component) = true];
  string name = 2 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string icon = 3;
  string description = 4;
}
