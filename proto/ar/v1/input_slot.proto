syntax = "proto3";
package ar.v1;

import "buf/validate/validate.proto";
import "resources/v1/resource_requirement.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.AR.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/ar/v1";

enum ARResourceSlotType {
  // No resource kind selected. Invalid for stored or add-requested slots.
  AR_RESOURCE_SLOT_TYPE_UNSPECIFIED = 0;
  // Slot expects a concrete robot instance.
  AR_RESOURCE_SLOT_TYPE_ROBOT = 1;
  // Slot expects a concrete asset instance.
  AR_RESOURCE_SLOT_TYPE_ASSET = 2;
}

enum ARContextSlotType {
  // No runtime context selected. Invalid for stored or add-requested slots.
  AR_CONTEXT_SLOT_TYPE_UNSPECIFIED = 0;
  // Slot resolves to the line containing the binding target, if known.
  AR_CONTEXT_SLOT_TYPE_LINE_ID = 1;
  // Slot resolves to the targeted cell or the parent cell of the targeted station.
  AR_CONTEXT_SLOT_TYPE_CELL_ID = 2;
  // Slot resolves to the targeted station. This may be empty for a cell-level
  // binding when no station has been established by the runtime session.
  AR_CONTEXT_SLOT_TYPE_STATION_ID = 3;
  // Slot resolves to the worker authenticated in the AR application session.
  AR_CONTEXT_SLOT_TYPE_WORKER_ID = 4;
  // Slot resolves to a process run id selected by run_selector.
  AR_CONTEXT_SLOT_TYPE_PROCESS_RUN_ID = 5;
  // Slot resolves to a sequence run id selected by run_selector.
  AR_CONTEXT_SLOT_TYPE_SEQUENCE_RUN_ID = 6;
  // Slot resolves to a task run id selected by run_selector.
  AR_CONTEXT_SLOT_TYPE_TASK_RUN_ID = 7;
}

// ARRunSelection defines which of an actor's tasks a run context slot follows.
//
// Candidate tasks are limited to ProcessRuns associated with the station or
// cell targeted by the resolved ARConfigBindingMessage. The backend assigns
// tasks to actors when a run is loaded and when actors become available, so
// most tasks are assigned to someone; an actor is a candidate for the tasks it
// could take over (TaskRun.candidate_actors). Tasks that cannot be assigned to
// or performed by the selected actor are excluded unless a policy explicitly
// selects historical or errored work.
//
// Unless a policy specifies otherwise, candidate ProcessRuns are ordered by:
// 1. state precedence: IN_PROGRESS, READY, QUEUED
// 2. initiated_at ascending
// 3. id ascending
//
// Within each ProcessRun, task order follows ProcessRun.task_run_ids. The
// runtime must populate that list in canonical execution order. IDs provide a
// deterministic tie-breaker when a policy otherwise considers candidates
// equivalent.
//
// To summarize
// • ASSIGNED: the actor's own task, the one it's working on or can start now.
// • ACTIONABLE: like ASSIGNED, or else work the actor could take over now.
// • NEXT_EXPECTED: the actor's task after that, which may still be blocked.
// • LAST_COMPLETED: the actor's most recently completed task.
// • FIRST_IN_ERROR: the actor's failed task, which needs attention.
//
// Guidance for a worker usually follows ACTIONABLE, and guidance for a robot
// ASSIGNED; a robot actor can't use ACTIONABLE. Feedback that shows a task
// assigned to another actor should make that clear.
enum ARRunSelection {
  // No selection policy specified. Invalid for a stored run selector.
  AR_RUN_SELECTION_UNSPECIFIED = 0;

  // Select what the actor can do now: the ASSIGNED task, or, when the actor has
  // none, the first ordered READY task assigned to another actor or to none
  // that the actor could take over (it is a feasible candidate, and the task
  // can be reassigned).
  //
  // Not valid for a robot actor, whose work is decided by assignment.
  AR_RUN_SELECTION_ACTIONABLE = 1;

  // Select the actor's own task: the first ordered task assigned to the actor
  // that it is working on (IN_PROGRESS or SUSPENDED), or else the first ordered
  // task assigned to it that it can start now (READY and can_do).
  //
  // The task stays selected while the actor works on it, and the actor's next
  // task is selected once it is done. Tasks assigned to other actors are never
  // selected.
  AR_RUN_SELECTION_ASSIGNED = 2;

  // Select the actor's next task after the ASSIGNED one: the first later
  // ordered task assigned to the actor that isn't done, even if it can't start
  // yet. Without an ASSIGNED task, the actor's first task that isn't done.
  AR_RUN_SELECTION_NEXT_EXPECTED = 3;

  // Select the actor's completed task with the latest completed_at timestamp.
  // Canonical execution order and then id are used as tie-breakers.
  AR_RUN_SELECTION_LAST_COMPLETED = 4;

  // Select the first ordered FAILED task associated with the actor (assigned to
  // it, or with the actor as a candidate).
  // This policy is valid only for TASK_RUN_ID.
  AR_RUN_SELECTION_FIRST_IN_ERROR = 5;
}

// ARActorSelector identifies the actor whose tasks are considered by a run
// selector.
message ARActorSelector {
  option (buf.validate.message).oneof = {
    fields: [
      "current_worker",
      "resource_slot_id"
    ]
    required: true
  };

  // Use the worker authenticated in the current AR application session.
  // Because scalar presence is represented by a non-default value here, this
  // field must be true when selected.
  bool current_worker = 1;

  // Use the robot bound to another ROBOT input slot in the same AR config.
  // The referenced slot must exist and have resource_type ROBOT; this
  // cross-entity constraint must be checked by the application/backend.
  string resource_slot_id = 2 [(buf.validate.field).string.(validation.v1.ar_input_slot_id_component) = true];
}

// ARRunContextSelector selects one of an actor's runs for the owning input
// slot:
//
// - TASK_RUN_ID returns the task the selection picks.
// - SEQUENCE_RUN_ID returns that task's immediate parent sequence.
// - PROCESS_RUN_ID returns a process run, chosen so it stays the same while
//   the actor works through it: the first ordered process run with a task the
//   selection could pick (for ASSIGNED, a task assigned to the actor that isn't
//   done; for ACTIONABLE, also a task the actor could take over), kept until it
//   is done or aborted. LAST_COMPLETED returns the most recently completed
//   process run with a task the actor completed, and NEXT_EXPECTED the process
//   run after the ASSIGNED one that has a task assigned to the actor.
//
// FIRST_IN_ERROR is intentionally limited to TASK_RUN_ID and is not projected
// to a parent sequence or process.
//
// If no run satisfies the policy, resolution produces no value and the
// context slot's generated property remains empty.
message ARRunContextSelector {
  option (buf.validate.message).cel = {
    id: "ar_run_context_selector.robot_not_actionable"
    message: "ACTIONABLE is only valid for the current worker; a robot follows its ASSIGNED tasks"
    expression: "!has(this.actor) || this.actor.resource_slot_id == '' || this.selection != ar.v1.ARRunSelection.AR_RUN_SELECTION_ACTIONABLE"
  };

  // Policy used to choose the actor's run.
  ARRunSelection selection = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  ARActorSelector actor = 2 [(buf.validate.field).required = true]; // Actor whose tasks are considered.
}

// ARInputSlotMessage is the authoritative config-owned input slot entity for
// AR configs.
//
// The backend is expected to derive and manage generated_property_id from the
// slot identity and value kind. Users should not author or edit the generated
// property directly.
//
// Resource slots are mandatory and materialization fails if no compatible
// resource binding can satisfy them. Context slots are optional and leave their
// generated property empty when the requested context cannot be resolved.
message ARInputSlotMessage {
  option (buf.validate.message).oneof = {
    fields: [
      "resource_type",
      "context_type"
    ]
    required: true
  };

  option (buf.validate.message).cel = {
    id: "ar_input_slot.error_selection_requires_task"
    message: "FIRST_IN_ERROR is only valid for TASK_RUN_ID"
    expression: "!has(this.run_selector) || this.run_selector.selection != ar.v1.ARRunSelection.AR_RUN_SELECTION_FIRST_IN_ERROR || this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_TASK_RUN_ID"
  };

  option (buf.validate.message).cel = {
    id: "ar_input_slot.run_selector_matches_context_type"
    message: "run_selector is required for run context slots and prohibited otherwise"
    expression: "(this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_PROCESS_RUN_ID || this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_SEQUENCE_RUN_ID || this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_TASK_RUN_ID) == has(this.run_selector)"
  };

  option (buf.validate.message).cel = {
    id: "ar_input_slot.explicit_requirements_match_resource_type"
    message: "explicit constraints must select a signal or an asset type compatible with the slot"
    expression:
      "this.explicit_requirements.all(requirement, "
      "this.resource_type == ar.v1.ARResourceSlotType.AR_RESOURCE_SLOT_TYPE_ROBOT "
      "? has(requirement.signal) && (has(requirement.signal.signal_id) || has(requirement.signal.semantic)) "
      ": this.resource_type == ar.v1.ARResourceSlotType.AR_RESOURCE_SLOT_TYPE_ASSET "
      "? has(requirement.asset_type) || (has(requirement.signal) && (has(requirement.signal.signal_id) || has(requirement.signal.semantic))) "
      ": false)"
  };

  string id = 1 [(buf.validate.field).string.(validation.v1.ar_input_slot_id_component) = true]; // Stable slot identifier used by configs and runtime resolution.
  string config_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.ar_config_id_component) = true
  ]; // Owning AR config.
  string name = 3 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string icon = 4;
  string description = 5;
  string generated_property_id = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.property_definition_id_component) = true
  ]; // Server-managed property that should receive the resolved slot value at runtime.
  ARResourceSlotType resource_type = 8 [(buf.validate.field).enum.defined_only = true]; // Selected when this slot expects a concrete resource binding.
  ARContextSlotType context_type = 9 [(buf.validate.field).enum.defined_only = true]; // Selected when this slot expects a runtime context value.
  ARRunContextSelector run_selector = 10; // Required resolution policy for process, sequence, and task run context slots.
  repeated resources.v1.ResourceRequirement explicit_requirements = 11; // Author-authored constraints in addition to requirements derived from consumers.
}

message ARInputSlotMessages {
  repeated ARInputSlotMessage slots = 1; // Config-owned input slots.
}

// ARInputSlotAddMessage creates a new config-owned input slot.
//
// The source kind determines the generated property's value kind. If the source
// kind must change later, prefer delete + recreate. A run selector is a mutable
// resolution policy and may be changed with ARInputSlotUpdateMessage.
// Resource slots are always required; context slots are always optional.
message ARInputSlotAddMessage {
  option (buf.validate.message).oneof = {
    fields: [
      "resource_type",
      "context_type"
    ]
    required: true
  };

  option (buf.validate.message).cel = {
    id: "ar_input_slot.error_selection_requires_task"
    message: "FIRST_IN_ERROR is only valid for TASK_RUN_ID"
    expression: "!has(this.run_selector) || this.run_selector.selection != ar.v1.ARRunSelection.AR_RUN_SELECTION_FIRST_IN_ERROR || this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_TASK_RUN_ID"
  };

  option (buf.validate.message).cel = {
    id: "ar_input_slot.run_selector_matches_context_type"
    message: "run_selector is required for run context slots and prohibited otherwise"
    expression: "(this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_PROCESS_RUN_ID || this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_SEQUENCE_RUN_ID || this.context_type == ar.v1.ARContextSlotType.AR_CONTEXT_SLOT_TYPE_TASK_RUN_ID) == has(this.run_selector)"
  };

  option (buf.validate.message).cel = {
    id: "ar_input_slot.explicit_requirements_match_resource_type"
    message: "explicit constraints must select a signal or an asset type compatible with the slot"
    expression:
      "this.explicit_requirements.all(requirement, "
      "this.resource_type == ar.v1.ARResourceSlotType.AR_RESOURCE_SLOT_TYPE_ROBOT "
      "? has(requirement.signal) && (has(requirement.signal.signal_id) || has(requirement.signal.semantic)) "
      ": this.resource_type == ar.v1.ARResourceSlotType.AR_RESOURCE_SLOT_TYPE_ASSET "
      "? has(requirement.asset_type) || (has(requirement.signal) && (has(requirement.signal.signal_id) || has(requirement.signal.semantic))) "
      ": false)"
  };

  string config_id = 1 [
    (buf.validate.field).string.(validation.v1.ar_config_id_component) = true,
    (buf.validate.field).required = true
  ]; // Owning AR config to attach the new slot to.
  string name = 2 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string icon = 3;
  string description = 4;
  ARResourceSlotType resource_type = 8 [(buf.validate.field).enum.defined_only = true]; // Use for slots that should be bound to a resource instance.
  ARContextSlotType context_type = 9 [(buf.validate.field).enum.defined_only = true]; // Use for slots that should be populated from runtime context.
  ARRunContextSelector run_selector = 10; // Required resolution policy for process, sequence, and task run context slots.
  repeated resources.v1.ResourceRequirement explicit_requirements = 11; // Initial author-authored resource constraints.
}

// ARInputSlotUpdateMessage updates the editable fields and resolution policy of
// an existing slot.
//
// The source kind and generated_property_id are intentionally not updated here.
// Those are structural and should be changed via recreate. The run selector may
// be updated because it changes resolution policy without changing value type.
message ARInputSlotUpdateMessage {
  string id = 1 [(buf.validate.field).string.(validation.v1.ar_input_slot_id_component) = true]; // Slot to update.
  string name = 2 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string icon = 3;
  string description = 4;
  ARRunContextSelector run_selector = 6; // Optional replacement policy; valid only for an existing run-context slot. The backend must load the existing slot and verify that the selector matches its immutable context_type.
  resources.v1.ResourceRequirements explicit_requirements = 7; // When present, replaces the explicit constraints of an existing resource slot. The backend must load the slot and enforce the same signal/asset-type compatibility rules as ARInputSlotMessage.
}

message ARInputSlotDeleteMessage {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.ar_input_slot_id_component) = true
  ]; // Slot to delete.
}
