syntax = "proto3";
package capability.v1;

import "buf/validate/validate.proto";
import "capability/v1/capability_profile.proto";
import "capability/v1/skill_definition.proto";

option csharp_namespace = "Messages.Capability.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/capability/v1";

enum ToolProperty {
  TOOL_PROPERTY_UNSPECIFIED = 0;
  TOOL_PROPERTY_TORQUE_CONTROLLED = 1;
  TOOL_PROPERTY_ESD_SAFE = 2;
  TOOL_PROPERTY_INSULATED = 3;
  TOOL_PROPERTY_COLLABORATIVE_SAFE = 4;
  TOOL_PROPERTY_CALIBRATED = 5;
  TOOL_PROPERTY_QUICK_CHANGE = 6;
}

// ToolRequirement says what a task needs to be done with: the roles a tool
// has to fill, and the properties and capability it must have.
//
// An actor can fill the roles itself when the intrinsic tool roles of its
// skills (SkillDefinition.intrinsic_tool_roles) cover every role and the
// requirement asks for nothing more, i.e. no required_properties, minimum_capability or
// allowed_tool_definition_ids: an operator positions or aligns a component by
// hand. Otherwise the actor needs a tool instance whose definition has the
// roles, properties and capability, and whose actor_kind fits the actor, e.g.
// ESD tweezers for an ESD-sensitive part, or a robot's gripper.
message ToolRequirement {
  repeated ToolRole roles = 1 [(buf.validate.field).repeated.items.enum.defined_only = true];
  repeated ToolProperty required_properties = 2 [(buf.validate.field).repeated.items.enum.defined_only = true];
  capability.v1.CapabilityProfile minimum_capability = 3;
  repeated string allowed_tool_definition_ids = 4;
}
