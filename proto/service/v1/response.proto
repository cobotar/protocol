syntax = "proto3";
package service.v1;

import "buf/validate/validate.proto";

option csharp_namespace = "Messages.Service.V1";
option go_package = "github.com/cobotar/protocol/messages/service/v1";

enum MutationStatus {
  MUTATION_STATUS_UNSPECIFIED = 0;
  MUTATION_STATUS_CREATED = 1;
  MUTATION_STATUS_UPDATED = 2;
  MUTATION_STATUS_UNCHANGED = 3;
  MUTATION_STATUS_DELETED = 4;
}

message ValidationViolation {
  // Empty for message-level violations. Otherwise, a protobuf field path,
  // using snake_case field names, for example "items[0].name".
  string field_path = 1 [(buf.validate.field).string.max_len = 512];
  string message = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  string rule_id = 3 [(buf.validate.field).string = {max_len: 256}]; // Optional because validators are not guaranteed to supply a stable rule ID.
}

message Response {
  option (buf.validate.message).cel = {
    id: "response.failure_has_error_details"
    message: "a failed response must contain a message or at least one validation violation"
    expression: "this.success || this.message != '' || this.validation_violations.size() > 0"
  };

  option (buf.validate.message).cel = {
    id: "response.validation_violations_only_on_failure"
    message: "a successful response must not contain validation violations"
    expression: "!this.success || this.validation_violations.size() == 0"
  };

  option (buf.validate.message).cel = {
    id: "response.mutation_result_only_on_success"
    message: "a failed response must not contain a mutation status or modified entity ID"
    expression: "this.success || (this.status == 0 && this.main_modified_id == '')"
  };

  bool success = 1; // True if the request was carried out, false if an error occurred
  string message = 2 [(buf.validate.field).string.max_len = 4096]; // Human-readable status or error summary. It may be empty when validation_violations contains the complete error details.
  string main_modified_id = 3 [(buf.validate.field).string.max_len = 256]; // Might contain an ID of the entity that mainly was modified (added, updated, deleted)
  MutationStatus status = 4 [(buf.validate.field).enum.defined_only = true];
  repeated ValidationViolation validation_violations = 5 [(buf.validate.field).repeated.max_items = 100];
}
