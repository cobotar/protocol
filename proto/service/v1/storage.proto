syntax = "proto3";
package service.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.Service.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/service/v1";

// StorageSeedRecord identifies the configured seed composition most recently
// applied to the stored data. It is absent when no seed composition has been
// applied or when its provenance is unknown (for example after loading an old
// dump that did not record it).
message StorageSeedRecord {
  string fingerprint = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-f0-9]{64}$"
  ];
  google.protobuf.Timestamp applied_at = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.lt_now = true
  ];
}

// StorageDumpRequest asks Authoring to write a logical dump to the `dumps`
// object-store bucket. object_name is the name within that bucket, not a path
// on the Authoring host.
//
// A dump is a ZIP file with:
//   - `manifest.json`: `format_version` (1), `data_version` (the stored data's
//     version, see cobotar/Authoring#72), `protocol_version`,
//     `authoring_version`, `created_at` (RFC 3339), `seed_record` (the
//     fingerprint, mode, files and time of the seeds the data was seeded from,
//     if any), `entity_counts` (per kind) and `files` (the object-store files
//     that entities refer to, by bucket, key and SHA-256; the files themselves
//     aren't in the dump);
//   - one `<kind>.jsonl` file per entity kind, e.g. `station.jsonl`, with one
//     JSON object per line: `id`, `revision` and `entity`, the entity as
//     protojson with proto field names.
//
// A dump loads only into an Authoring that reads the same data version.
message StorageDumpRequest {
  string object_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).string.(validation.v1.not_blank) = true
  ];
}

// StorageDumpResult describes a dump successfully stored in the `dumps`
// object-store bucket. A failed dump returns Response instead.
message StorageDumpResult {
  string object_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).string.(validation.v1.not_blank) = true
  ];
  uint64 size_bytes = 2 [(buf.validate.field).uint64.gt = 0];
  map<string, uint64> entity_counts = 3 [
    (buf.validate.field).map.keys.string = {
      min_len: 1
      max_len: 256
    },
    (buf.validate.field).map.keys.string.(validation.v1.not_blank) = true
  ];
  google.protobuf.Timestamp created_at = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.lt_now = true
  ];
}

// StorageLoadRequest asks Authoring to replace its stored data with the dump
// identified by object_name in the `dumps` object-store bucket. Authoring
// checks the whole dump first; a dump that fails a check changes nothing.
// After a load, Authoring restarts in place: it publishes
// `event.server.restarted` with `data_wiped: true` and `reset_reason:
// "storage_loaded"`, so clients refetch, and aborts the process runs that were
// active in the dump.
message StorageLoadRequest {
  string object_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).string.(validation.v1.not_blank) = true
  ];
}

// StorageClearRequest asks Authoring to remove all stored data. The caller
// must copy the current ServerInfo.instance_id into confirmation_instance_id;
// this prevents a stale confirmation from clearing a restarted backend. After
// a clear, Authoring restarts in place and publishes `event.server.restarted`
// with `data_wiped: true` and `reset_reason: "storage_cleared"`.
message StorageClearRequest {
  optional bool apply_configured_seeds = 1;
  string confirmation_instance_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// StorageInfo describes the current Authoring store. backend identifies the
// storage implementation, for example "sqlite" or "postgresql". instance_id
// is the value a caller must repeat when sending StorageClearRequest.
message StorageInfo {
  string backend = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.(validation.v1.not_blank) = true
  ];
  string instance_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  uint64 size_bytes = 3;
  map<string, uint64> entity_counts = 4 [
    (buf.validate.field).map.keys.string = {
      min_len: 1
      max_len: 256
    },
    (buf.validate.field).map.keys.string.(validation.v1.not_blank) = true
  ];
  StorageSeedRecord seed_record = 5;
  bool experimenter_mode = 6;
  google.protobuf.Timestamp last_dump_at = 7 [(buf.validate.field).timestamp.lt_now = true];
}

// StorageCollectGarbageRequest asks Authoring to remove the uploaded model
// files that nothing refers to (cobotar/Authoring#17). Model files are
// uploaded under content-addressed keys, `<kind>/<sha256>/<filename>`
// (resources.v1.UploadedObject), and several models can share one, so
// deleting a model leaves its files; this command removes them later.
//
// A file is removed when it is in a bucket that models' files are in, has a
// content-addressed key, is older than min_age, no model refers to it, and no
// dump in the `dumps` bucket lists it in its manifest (so a dump can still be
// loaded with its files). Files under other keys, such as seeded ones, are
// never removed.
message StorageCollectGarbageRequest {
  // List the files that would be removed, without removing them.
  bool dry_run = 1;

  // Keep files younger than this, e.g. ones uploaded for a model that is
  // being created. One hour when unset.
  google.protobuf.Duration min_age = 2 [(buf.validate.field).duration.gte = {}];
}

// StorageObject is a file in an object-store bucket.
message StorageObject {
  string bucket = 1 [(buf.validate.field).required = true];
  string key = 2 [(buf.validate.field).required = true];
  uint64 size_bytes = 3;
}

// StorageCollectGarbageResult lists the files a StorageCollectGarbageRequest
// removed, or would remove when it was a dry run. A failed collection
// returns Response instead.
message StorageCollectGarbageResult {
  bool dry_run = 1;
  repeated StorageObject removed = 2;
  uint64 removed_bytes = 3;
  // How many content-addressed files were kept because something refers to
  // them or they are younger than min_age.
  uint64 kept = 4;
}
