syntax = "proto3";
package robot.v1;

import "robot/v1/program_state.proto";

option csharp_namespace = "Messages.Robot.V1";
option go_package = "github.com/cobotar/protocol/messages/robot/v1";

message ProgramStateRequest {
  string robot_id = 1;
  ProgramState state = 2;
}

message AcknowledgeRobot {
  string robot_id = 1;
}

// RobotFreeDriveRequest starts (enabled) or stops free drive, on
// command.robot_instance.free_drive.{robot_instance_id}. Both are idempotent.
message RobotFreeDriveRequest {
  string robot_id = 1;
  bool enabled = 2;
}
