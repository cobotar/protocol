syntax = "proto3";
package robot.v1;

import "buf/validate/validate.proto";
import "common/v1/signal.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.Robot.V1";
option go_package = "github.com/cobotar/protocol/messages/robot/v1";

enum RobotAdapterCommandType {
  ROBOT_ADAPTER_COMMAND_TYPE_UNSPECIFIED = 0;

  ROBOT_ADAPTER_COMMAND_TYPE_PROGRAM_PLAY = 1;
  ROBOT_ADAPTER_COMMAND_TYPE_PROGRAM_PAUSE = 2;
  ROBOT_ADAPTER_COMMAND_TYPE_PROGRAM_STOP = 3;

  ROBOT_ADAPTER_COMMAND_TYPE_ACKNOWLEDGE = 10;
  ROBOT_ADAPTER_COMMAND_TYPE_SHOW_POPUP = 11;
  ROBOT_ADAPTER_COMMAND_TYPE_HIDE_POPUP = 12;

  ROBOT_ADAPTER_COMMAND_TYPE_LOAD_PROGRAM = 20;
  ROBOT_ADAPTER_COMMAND_TYPE_LOAD_INSTALLATION = 21;

  ROBOT_ADAPTER_COMMAND_TYPE_POWER_ON = 30;
  ROBOT_ADAPTER_COMMAND_TYPE_POWER_OFF = 31;
  ROBOT_ADAPTER_COMMAND_TYPE_BRAKE_RELEASE = 32;

  // Free drive: the robot can be moved by hand. START and STOP are idempotent,
  // like PROGRAM_PLAY and PROGRAM_PAUSE.
  ROBOT_ADAPTER_COMMAND_TYPE_FREE_DRIVE_START = 40;
  ROBOT_ADAPTER_COMMAND_TYPE_FREE_DRIVE_STOP = 41;
}

// RobotAdapterPlanType is a plan of the robot's next motion that an adapter
// publishes, however it gets it (e.g. from the robot program).
enum RobotAdapterPlanType {
  ROBOT_ADAPTER_PLAN_TYPE_UNSPECIFIED = 0;

  // The TCP path of the next motion: plan.robot.path.{robot_instance_id}.{plan_id}.
  ROBOT_ADAPTER_PLAN_TYPE_PATH = 1;
  // The waypoints of the next motion.
  ROBOT_ADAPTER_PLAN_TYPE_WAYPOINTS = 2;
  // The joint angles the robot will move to.
  ROBOT_ADAPTER_PLAN_TYPE_JOINT_ANGLES = 3;
}

enum RobotAdapterTelemetryType {
  ROBOT_ADAPTER_TELEMETRY_TYPE_UNSPECIFIED = 0;

  ROBOT_ADAPTER_TELEMETRY_TYPE_ROBOT_STATE = 1;
  ROBOT_ADAPTER_TELEMETRY_TYPE_JOINT_STATE = 2;
  ROBOT_ADAPTER_TELEMETRY_TYPE_TCP_POSE = 3;
  ROBOT_ADAPTER_TELEMETRY_TYPE_TCP_WRENCH = 4;
  ROBOT_ADAPTER_TELEMETRY_TYPE_IO_STATE = 5;
}

message RobotAdapterCommandCapability {
  RobotAdapterCommandType type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}

message RobotAdapterPlanCapability {
  RobotAdapterPlanType type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}

message RobotAdapterTelemetryCapability {
  RobotAdapterTelemetryType type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Publication rate guaranteed by the adapter definition.
  optional double frequency_hz = 2 [(buf.validate.field).double = {
    gt: 0
    finite: true
  }];
}

message RobotControllerIdentity {
  string manufacturer = 1;
  string model = 2;
  string serial_number = 3;
  string controller_software_version = 4;
}

message RobotAdapterInfoMessage {
  option (buf.validate.message).cel = {
    id: "robot_adapter_info.signal_catalog_resource_id"
    message: "the signal catalog resource id must match the adapter info robot id"
    expression: "this.signal_catalog.resource_id == this.robot_id"
  };

  string robot_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.robot_instance_id_component) = true
  ];

  // Version of the adapter implementation, not the Protobuf API.
  string adapter_version = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.not_blank) = true
  ];

  // Identity actually reported by the connected controller.
  RobotControllerIdentity controller = 6;

  // Deterministic fingerprint of adapter_definition_id and the effective signal catalog.
  string capabilities_revision = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.not_blank) = true
  ];

  // Static adapter capabilities selected by the robot definition.
  string adapter_definition_id = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.robot_adapter_definition_id_component) = true
  ];

  // Signals configured for this connected robot instance.
  common.v1.SignalCatalog signal_catalog = 10 [(buf.validate.field).required = true];
}
