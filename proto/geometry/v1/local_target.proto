syntax = "proto3";
package geometry.v1;

import "buf/validate/validate.proto";
import "geometry/v1/anchor.proto";
import "geometry/v1/point.proto";
import "geometry/v1/quad.proto";

option csharp_namespace = "Messages.Geometry.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/geometry/v1";

// A pose relative to an anchor: the position and orientation of a frame in
// the frame the anchor names. What an anchor may name depends on where the
// target is used. In a process recipe (SequenceDefinition.local_target and
// ProductTarget.local_target) it names a process-local frame: `<process>`,
// `<parent>` or an ancestor sequence (cobotar/protocol#50, see
// process.v1.SequenceDefinition.local_target).
//
// An omitted position is the anchor's origin, and an omitted orientation is
// the identity. A present orientation is a unit quaternion (its squared
// length is within 0.001 of 1); an all-zero one is refused rather than read as
// the identity.
message LocalTarget {
  option (buf.validate.message).cel = {
    id: "local_target.orientation.unit"
    message: "orientation must be a unit quaternion; omit it for the identity"
    expression:
      "!has(this.orientation) || ("
      "this.orientation.x * this.orientation.x + this.orientation.y * this.orientation.y + this.orientation.z * this.orientation.z + this.orientation.w * this.orientation.w >= 0.999 && "
      "this.orientation.x * this.orientation.x + this.orientation.y * this.orientation.y + this.orientation.z * this.orientation.z + this.orientation.w * this.orientation.w <= 1.001)"
  };

  Anchor anchor = 1;
  Point position = 2;
  Quad orientation = 3;
}
