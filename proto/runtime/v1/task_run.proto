syntax = "proto3";
package runtime.v1;

import "buf/validate/validate.proto";
import "common/v1/actor.proto";
import "common/v1/time.proto";
import "google/protobuf/timestamp.proto";
import "resources/v1/container_definition.proto";
import "runtime/v1/actor_assignment.proto";
import "runtime/v1/process_requests.proto";
import "runtime/v1/runtime_restriction.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.Runtime.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/runtime/v1";

enum TaskRunState {
  // Invalid sentinel; persisted task runs must have a concrete runtime state.
  TASK_RUN_STATE_UNSPECIFIED = 0;

  // The task is blocked by sequence ordering, prerequisites, or runtime conditions.
  TASK_RUN_STATE_NOT_READY = 1;

  // The task is eligible to start when its actor and runtime requirements are satisfied.
  TASK_RUN_STATE_READY = 2;

  // The task has started, resumed, or is being retried.
  TASK_RUN_STATE_IN_PROGRESS = 3;

  // The task successfully achieved its intended outcome.
  TASK_RUN_STATE_DONE = 4;

  // The task was attempted but did not achieve its intended outcome. It may
  // be retried or reset; aborting the owning process remains a separate action.
  TASK_RUN_STATE_FAILED = 5;

  // The task was stopped because its owning process was aborted and cannot resume.
  TASK_RUN_STATE_ABORTED = 6;

  // The task is paused after starting and may later resume in progress.
  TASK_RUN_STATE_SUSPENDED = 7;
}

// Concrete runtime/deployment bindings resolved for this task run.
message TaskRuntimeBinding {
  string asset_instance_id = 1 [(buf.validate.field).string.(validation.v1.asset_instance_id_component) = true]; // Concrete asset selected for this task run.
  string station_id = 2 [(buf.validate.field).string.(validation.v1.station_id_component) = true]; // Concrete station in which the task runs.
  string cell_id = 3 [(buf.validate.field).string.(validation.v1.cell_id_component) = true]; // Concrete cell in which the task runs.
  resources.v1.ContainerSlotRef container_slot = 4; // Concrete container slot selected for source or destination work.
  repeated string candidate_part_instance_ids = 5 [(buf.validate.field).repeated.items.string.(validation.v1.part_instance_id_component) = true]; // Candidate parts. Notice that their availability must be checked during runtime. Also, new candidates might be available.
}

message TaskRun {
  string id = 1;
  string name = 2;
  string icon = 3;
  string task_definition_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.task_definition_id_component) = true
  ];
  string parent_sequence_run_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.sequence_run_id_component) = true
  ];
  TaskRunState state = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  repeated common.v1.ActorRef candidate_actors = 7;
  common.v1.ActorRef assigned_actor = 8; // is the authoritative current task assignment.
  bool can_do = 9;
  bool can_undo = 10;
  int32 workable_horizon = 11; // steps needed to complete before this step is workable.
  common.v1.EstimatedDuration estimated_duration = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp completed_at = 14;
  string failure_code = 15; // Machine-readable reason for the current FAILED state.
  string failure_message = 16; // Human-readable reason for the current FAILED state.
  TaskRuntimeBinding binding = 17;

  // Effective runtime restrictions that currently apply to this task.
  //
  // These restrictions are the effective restrictions for the currently
  // assigned actor and execution context. They may be copied from
  // candidate-level evaluation results during assignment or reassignment.
  //
  // Examples:
  // - AR guidance required because the assigned actor's skill is restricted
  // - supervisor approval required before completion
  // - tool feedback required due to safety/quality constraints
  repeated RuntimeRestriction restrictions = 19;

  repeated CandidateActorEvaluation candidate_actor_evaluations = 20;

  // Current actor-assignment resolution for this task.
  TaskActorAssignmentStatus actor_assignment_status = 21 [(buf.validate.field).required = true];

  // Revision used to prevent concurrent state changes and reassignments from
  // overwriting one another. Starts at 1.
  uint64 revision = 22 [(buf.validate.field).uint64.gte = 1];
}

message TaskRuns {
  repeated TaskRun items = 1;
}
