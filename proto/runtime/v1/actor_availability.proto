syntax = "proto3";
package runtime.v1;

import "buf/validate/validate.proto";
import "common/v1/actor.proto";
import "google/protobuf/timestamp.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.Runtime.V1";
option go_package = "github.com/cobotar/protocol/messages/runtime/v1";

// ActorAvailabilityStatus describes whether an actor can currently be
// considered for new task assignments.
enum ActorAvailabilityStatus {
  // No status was supplied. Services should normally resolve this to UNKNOWN
  // rather than treating the actor as available.
  ACTOR_AVAILABILITY_STATUS_UNSPECIFIED = 0;

  // The actor is currently eligible to receive new task assignments, subject
  // to task-specific capability, location, and resource requirements.
  ACTOR_AVAILABILITY_STATUS_AVAILABLE = 1;

  // The actor is explicitly known not to be available for new task
  // assignments.
  ACTOR_AVAILABILITY_STATUS_UNAVAILABLE = 2;

  // The actor's current availability cannot be determined from the available
  // observations. UNKNOWN must not be treated as AVAILABLE automatically.
  ACTOR_AVAILABILITY_STATUS_UNKNOWN = 3;
}

// ActorAvailabilitySource identifies the primary source that determined the
// current resolved availability state.
enum ActorAvailabilitySource {
  // The source of the current availability state is not known.
  ACTOR_AVAILABILITY_SOURCE_UNSPECIFIED = 0;

  // The availability was explicitly reported by the actor or entered
  // manually by an operator.
  ACTOR_AVAILABILITY_SOURCE_MANUAL = 1;

  // The availability was inferred from an equipped device, such as an active
  // AR headset or mobile device.
  ACTOR_AVAILABILITY_SOURCE_DEVICE = 2;

  // The availability was derived from a work schedule, shift, or planned
  // attendance period.
  ACTOR_AVAILABILITY_SOURCE_SCHEDULE = 3;

  // The availability was derived automatically by a backend service,
  // controller, heartbeat monitor, or other system process.
  ACTOR_AVAILABILITY_SOURCE_SYSTEM = 4;

  // The availability was explicitly set or overridden by a supervisor.
  ACTOR_AVAILABILITY_SOURCE_SUPERVISOR = 5;
}

// ActorLocation identifies the actor's currently known operational scope.
//
// Only the most specific known scope should normally be supplied. Parent
// scopes can be resolved through the station/cell/line hierarchy.
message ActorLocation {
  option (buf.validate.message).oneof = {
    fields: [
      "line_id",
      "cell_id",
      "station_id"
    ]
    required: true
  };

  // The actor is known to be operating somewhere within this line.
  string line_id = 1 [(buf.validate.field).string.(validation.v1.line_id_component) = true];

  // The actor is known to be operating somewhere within this cell.
  string cell_id = 2 [(buf.validate.field).string.(validation.v1.cell_id_component) = true];

  // The actor is known to be operating at this station.
  string station_id = 3 [(buf.validate.field).string.(validation.v1.station_id_component) = true];
}

// ActorAvailability is the current resolved runtime availability projection
// for one human or robot actor.
//
// It contains operational state rather than authored actor information.
// Availability changes should produce update events so active ProcessRuns can
// re-evaluate affected task assignments.
message ActorAvailability {
  // Stable identifier of this availability entity.
  //
  // There should normally be exactly one ActorAvailability entity for each
  // ActorRef. The service should enforce that uniqueness.
  string id = 1 [(buf.validate.field).string.(validation.v1.actor_availability_id_component) = true];

  // Optional human-readable name for administration and diagnostics.
  //
  // This is display metadata for the availability entity and is not the
  // canonical name of the referenced actor.
  string name = 2 [(buf.validate.field).string.(validation.v1.name_component) = true];

  // Optional icon used when presenting this availability entity.
  //
  // This is display metadata and should not replace the referenced actor's
  // canonical icon.
  string icon = 3;

  // The human or robot actor whose current availability is represented.
  common.v1.ActorRef actor = 4;

  // The actor's currently resolved availability for new task assignments.
  ActorAvailabilityStatus status = 5 [(buf.validate.field).enum.defined_only = true];

  // The actor's most recently known operational scope.
  //
  // An absent location means that the actor's location is unknown; it must
  // not imply that the actor is globally available.
  ActorLocation location = 6;

  // The primary source that determined the current resolved status.
  ActorAvailabilitySource source = 7 [(buf.validate.field).enum.defined_only = true];

  // Optional explanation for the current status, such as "signed_out",
  // "off_shift", "device_offline", or "robot_fault".
  string reason = 8;

  // Time at which the underlying availability observation was made.
  //
  // This may differ from the time at which this entity was persisted.
  google.protobuf.Timestamp observed_at = 9;

  // Optional time after which this availability must no longer be trusted.
  //
  // Once expired, the resolver should normally treat the actor's availability
  // as UNKNOWN until a newer observation is received.
  google.protobuf.Timestamp valid_until = 10;

  // Service-managed monotonic revision of this resolved availability.
  //
  // Consumers can use this to reject duplicate or out-of-order updates.
  uint64 revision = 11;
}

message ActorAvailabilities {
  repeated ActorAvailability items = 1;
}
