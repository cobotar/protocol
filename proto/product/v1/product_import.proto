syntax = "proto3";
package product.v1;

import "buf/validate/validate.proto";
import "product/v1/part_definition.proto";
import "product/v1/product_definition.proto";
import "resources/v1/model_requests.proto";
import "service/v1/response.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.Product.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/product/v1";

// ImportProduct creates or updates a product with its models and parts in one
// request (edit.product.import, cobotar/protocol#31), e.g. an export from a
// CAD tool. The backend applies it in one unit of work: it changes everything
// or nothing. The files are uploaded first (see resources.v1.UploadedObject).
//
// The models and parts have keys, which are only valid within the request: a
// part names its default model by model_key, and an assembly node names its
// part by the part's key in part_definition_id.
//
// Importing again is matched by external reference. An imported part or
// product that has an external reference (system and external_id) of an
// existing part or product updates that one instead of creating another. An
// updated part gets a new revision, so runs pinned to its earlier revision
// keep that one (cobotar/protocol#19). Models are matched by content hash, not
// by external reference: a model whose files changed is a new model, which the
// part's new revision points to, while the earlier model stays for the
// earlier revision. A part or product without external references is always
// created. An import is refused when two of its parts share a reference, or
// when one reference matches several existing parts or products.
message ImportProduct {
  option (buf.validate.message).cel = {
    id: "import_product.model_keys_defined"
    message: "every part's model_key must be the key of a model in the request"
    expression: "this.parts.all(part, part.model_key == '' || this.models.exists(model, model.key == part.model_key))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.part_keys_defined"
    message: "every assembly node's part_definition_id must be the key of a part in the request"
    expression: "!has(this.product) || this.product.nodes.all(node, node.part_definition_id == '' || this.parts.exists(part, part.key == node.part_definition_id))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.part_references_unique"
    message: "two imported parts must not share an external reference (system and external_id)"
    expression: "this.parts.all(part, part.part.external_references.all(reference, this.parts.filter(other, other.part.external_references.exists(r, r.system == reference.system && r.external_id == reference.external_id)).size() == 1))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.product_without_id"
    message: "the imported product must not have an id; it's matched by external reference"
    expression: "!has(this.product) || this.product.id == ''"
  };
  option (buf.validate.message).cel = {
    id: "import_product.nodes_without_override_model"
    message: "assembly nodes of an imported product must not set override_model_id"
    expression: "!has(this.product) || this.product.nodes.all(node, node.override_model_id == '')"
  };

  repeated ImportedModel models = 1 [(buf.validate.field).cel = {
    id: "import_product.models.unique_keys"
    message: "model keys must be unique"
    expression: "this.map(model, model.key).unique()"
  }];
  repeated ImportedPart parts = 2 [(buf.validate.field).cel = {
    id: "import_product.parts.unique_keys"
    message: "part keys must be unique"
    expression: "this.map(part, part.key).unique()"
  }];
  // The product. Its nodes name their parts by key in part_definition_id.
  ProductDefinition product = 3 [(buf.validate.field).required = true];
}

// ImportedModel is a model of an ImportProduct, with its key in the request.
message ImportedModel {
  string key = 1 [(buf.validate.field).string.(validation.v1.key_component) = true];
  resources.v1.CreateModelArtifact model = 2 [(buf.validate.field).required = true];
}

// ImportedPart is a part definition of an ImportProduct, with its key in the
// request. The part has no id, revision or default_model_id: it's matched by
// external reference, and names its default model by model_key.
message ImportedPart {
  option (buf.validate.message).cel = {
    id: "imported_part.without_ids"
    message: "an imported part must not set id, revision or default_model_id"
    expression: "!has(this.part) || (this.part.id == '' && this.part.revision == 0u && this.part.default_model_id == '')"
  };

  string key = 1 [(buf.validate.field).string.(validation.v1.key_component) = true];
  PartDefinition part = 2 [(buf.validate.field).required = true];
  // The key of the part's default model in the request; empty for none.
  string model_key = 3;
}

// ImportProductResult answers an ImportProduct that was applied. A refused
// import is answered with a failed service.v1.Response.
message ImportProductResult {
  ImportedEntity product = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "import_product_result.product_without_key"
      message: "the product's result has no key"
      expression: "this.key == ''"
    }
  ];
  // One per model of the request, in its order.
  repeated ImportedEntity models = 2 [(buf.validate.field).cel = {
    id: "import_product_result.models_keyed"
    message: "every model's result names its key, once"
    expression: "this.all(model, model.key != '') && this.map(model, model.key).unique()"
  }];
  // One per part of the request, in its order.
  repeated ImportedEntity parts = 3 [(buf.validate.field).cel = {
    id: "import_product_result.parts_keyed"
    message: "every part's result names its key, once"
    expression: "this.all(part, part.key != '') && this.map(part, part.key).unique()"
  }];
}

// ImportedEntity is what an import did with one model, part or product:
// CREATED, UPDATED (a part's new revision, or the product), or UNCHANGED (an
// existing model with the same content, or a part or product that matched and
// didn't change).
message ImportedEntity {
  string key = 1; // Empty for the product.
  string id = 2 [(buf.validate.field).required = true];
  service.v1.MutationStatus status = 3 [(buf.validate.field).enum = {
    in: [
      1,
      2,
      3
    ]
  }];
}
