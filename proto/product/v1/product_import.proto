syntax = "proto3";
package product.v1;

import "buf/validate/validate.proto";
import "product/v1/part_definition.proto";
import "product/v1/part_family.proto";
import "product/v1/product_definition.proto";
import "resources/v1/model_requests.proto";
import "service/v1/response.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.Product.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/product/v1";

// ImportProduct creates or updates a product with its models and parts in one
// request (edit.product.import, cobotar/protocol#31), e.g. an export from a
// CAD tool. The product is optional: without it, the import creates or updates
// only the models and parts. The backend applies it in one unit of work: it
// changes everything or nothing. The files are uploaded first (see
// resources.v1.UploadedObject).
//
// The models, part families and parts have keys, which are only valid within
// the request: a part names its default model by model_key and its families by
// family_key (ImportedPart.families), and an assembly node names its part by
// the part's key in part_definition_id.
//
// Importing again is matched by external reference. An imported part or
// product that has an external reference (system and external_id) of an
// existing part or product updates that one instead of creating another. An
// updated part gets a new revision, so runs pinned to its earlier revision
// keep that one (cobotar/protocol#19). Models are matched by content hash, not
// by external reference: a model whose files changed is a new model, which the
// part's new revision points to, while the earlier model stays for the
// earlier revision. Part families are matched by external reference like
// parts (cobotar/protocol#36). A part, family or product without external
// references is always created. An import is refused when two of its parts or
// two of its families share a reference, or when one reference matches
// several existing parts, families or products. product_mode says whether the
// product updates the one it matches or is a new product (ProductImportMode,
// cobotar/protocol#44); parts and families are matched in every mode.
//
// An imported part's memberships follow ImportedPart.families, and an import
// only changes the memberships of the families it carries
// (ImportProduct.families): when ImportedPart.families is absent, an updated
// part keeps all its memberships (so an exporter that doesn't know about
// families leaves them alone); when it's present, the part's memberships of
// the import's families become its items (an empty list removes them), and
// its memberships of other families, e.g. ones added in another client, are
// kept. To take a part out of a family, an import carries the family. An
// imported family
// is created or updated with the request's dimensions, under the same rules
// as other changes to a family (PartFamily): a family with members keeps its
// dimension keys, so an import that adds or removes a dimension of such a
// family is refused.
message ImportProduct {
  option (buf.validate.message).cel = {
    id: "import_product.model_keys_defined"
    message: "every part's model_key must be the key of a model in the request"
    expression: "this.parts.all(part, part.model_key == '' || this.models.exists(model, model.key == part.model_key))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.part_keys_defined"
    message: "every assembly node's part_definition_id must be the key of a part in the request"
    expression: "!has(this.product) || this.product.nodes.all(node, node.part_definition_id == '' || this.parts.exists(part, part.key == node.part_definition_id))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.part_references_unique"
    message: "two imported parts must not share an external reference (system and external_id)"
    expression: "this.parts.all(part, part.part.external_references.all(reference, this.parts.filter(other, other.part.external_references.exists(r, r.system == reference.system && r.external_id == reference.external_id)).size() == 1))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.family_keys_defined"
    message: "every part's family_key must be the key of a part family in the request"
    expression: "this.parts.all(part, part.families.items.all(membership, this.families.exists(family, family.key == membership.family_key)))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.one_family_per_kind"
    message: "a part can belong to at most one part family of each kind"
    expression: "this.parts.all(part, part.families.items.all(membership, part.families.items.filter(other, this.families.exists(a, a.key == membership.family_key && this.families.exists(b, b.key == other.family_key && b.family.kind == a.family.kind))).size() <= 1))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.family_values_complete"
    message: "a part's values for a family must be keyed by exactly that family's dimension keys"
    expression: "this.parts.all(part, part.families.items.all(membership, this.families.filter(family, family.key == membership.family_key).all(family, membership.values.size() == family.family.dimensions.size() && family.family.dimensions.all(dimension, dimension.key in membership.values))))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.family_references_unique"
    message: "two imported part families must not share an external reference (system and external_id)"
    expression: "this.families.all(family, family.family.external_references.all(reference, this.families.filter(other, other.family.external_references.exists(r, r.system == reference.system && r.external_id == reference.external_id)).size() == 1))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.product_without_id"
    message: "the imported product must not have an id; it's matched by external reference"
    expression: "!has(this.product) || this.product.id == ''"
  };
  option (buf.validate.message).cel = {
    id: "import_product.product_model_key_defined"
    message: "product_model_key must be the key of a model in the request, and needs a product"
    expression: "this.product_model_key == '' || (has(this.product) && this.models.exists(model, model.key == this.product_model_key))"
  };
  option (buf.validate.message).cel = {
    id: "import_product.product_without_model_id"
    message: "the imported product must not set model_id; it names its model by product_model_key"
    expression: "!has(this.product) || this.product.model_id == ''"
  };
  option (buf.validate.message).cel = {
    id: "import_product.nodes_without_override_model"
    message: "assembly nodes of an imported product must not set override_model_id"
    expression: "!has(this.product) || this.product.nodes.all(node, node.override_model_id == '')"
  };
  option (buf.validate.message).cel = {
    id: "import_product.product_mode_with_product"
    message: "an import with a product needs a product_mode, and one without a product mustn't set it"
    expression: "has(this.product) == (this.product_mode != 0)"
  };

  repeated ImportedModel models = 1 [(buf.validate.field).cel = {
    id: "import_product.models.unique_keys"
    message: "model keys must be unique"
    expression: "this.map(model, model.key).unique()"
  }];
  repeated ImportedPart parts = 2 [(buf.validate.field).cel = {
    id: "import_product.parts.unique_keys"
    message: "part keys must be unique"
    expression: "this.map(part, part.key).unique()"
  }];
  // The product, if the import has one. Its nodes name their parts by key in
  // part_definition_id.
  ProductDefinition product = 3;
  // The key of the product's model (ProductDefinition.model_id) in the
  // request, e.g. the whole assembly with its thumbnail; empty for none, which
  // keeps the model of the product the import updates.
  string product_model_key = 4;
  // The part families the parts name by key in ImportedPart.families.
  repeated ImportedPartFamily families = 5 [(buf.validate.field).cel = {
    id: "import_product.families.unique_keys"
    message: "part family keys must be unique"
    expression: "this.map(family, family.key).unique()"
  }];
  // What the product does with the product it matches by external reference;
  // required when the import has a product.
  ProductImportMode product_mode = 6 [(buf.validate.field).enum.defined_only = true];
}

// ProductImportMode is what an imported product does with the existing product
// that has one of its external references (cobotar/protocol#44). The importer
// always sends the product's references; the mode decides what the backend
// does with them. Parts and part families are matched and updated in every
// mode, since other entities name them.
enum ProductImportMode {
  PRODUCT_IMPORT_MODE_UNSPECIFIED = 0;
  // Update the product with the reference, or create it when there is none.
  // Later imports update it.
  PRODUCT_IMPORT_MODE_UPDATE = 1;
  // Create a new product with the references, which later imports update. The
  // product that had them loses those references, and keeps its contents and
  // recipes; " (replaced)" is appended to its name and a line naming the new
  // product to its description, and ImportProductResult.replaced_product names
  // it. Without such a product, the new one is created as with UPDATE.
  PRODUCT_IMPORT_MODE_NEW_TAKES_OVER = 2;
  // Create a new product without the references, as a one-off copy. Later
  // imports keep updating the product that has them.
  PRODUCT_IMPORT_MODE_NEW_DETACHED = 3;
}

// ImportedModel is a model of an ImportProduct, with its key in the request.
message ImportedModel {
  string key = 1 [(buf.validate.field).string.(validation.v1.key_component) = true];
  resources.v1.CreateModelArtifact model = 2 [(buf.validate.field).required = true];
}

// ImportedPart is a part definition of an ImportProduct, with its key in the
// request. The part has no id, revision, default_model_id or families: it's
// matched by external reference, names its default model by model_key and its
// families by key in families.
message ImportedPart {
  option (buf.validate.message).cel = {
    id: "imported_part.without_ids"
    message: "an imported part must not set id, revision, default_model_id or families"
    expression: "!has(this.part) || (this.part.id == '' && this.part.revision == 0u && this.part.default_model_id == '' && this.part.families.size() == 0)"
  };

  string key = 1 [(buf.validate.field).string.(validation.v1.key_component) = true];
  PartDefinition part = 2 [(buf.validate.field).required = true];
  // The key of the part's default model in the request; empty for none.
  string model_key = 3;
  // The part's families (ImportProduct.families, by key), with its value for
  // each of their dimensions. Absent keeps the memberships of the part the
  // import updates. Present sets its memberships of the import's families to
  // these (present but empty removes them) and keeps its memberships of other
  // families. Together with those, the part is in at most one family of each
  // kind.
  ImportedPartFamilyMemberships families = 4;
}

// ImportedPartFamilyMemberships wraps an imported part's memberships, so an
// import can tell "leave them" (absent) from "none of the import's families"
// (present, empty).
message ImportedPartFamilyMemberships {
  repeated ImportedPartFamilyMembership items = 1 [(buf.validate.field).cel = {
    id: "imported_part.families.unique"
    message: "an imported part can't name a family twice"
    expression: "this.map(membership, membership.family_key).unique()"
  }];
}

// ImportedPartFamilyMembership is a PartFamilyMembership of an imported part,
// naming the family by its key in the request.
message ImportedPartFamilyMembership {
  string family_key = 1 [(buf.validate.field).string.(validation.v1.key_component) = true];
  // The part's value for each dimension of the family, by dimension key.
  map<string, string> values = 2 [
    (buf.validate.field).map.keys.string.(validation.v1.key_component) = true,
    (buf.validate.field).map.values.string.(validation.v1.name_component) = true
  ];
}

// ImportedPartFamily is a part family of an ImportProduct, with its key in the
// request. The family has no id or revision: it's matched by external
// reference.
message ImportedPartFamily {
  option (buf.validate.message).cel = {
    id: "imported_part_family.without_ids"
    message: "an imported part family must not set id or revision"
    expression: "!has(this.family) || (this.family.id == '' && this.family.revision == 0u)"
  };

  string key = 1 [(buf.validate.field).string.(validation.v1.key_component) = true];
  PartFamily family = 2 [(buf.validate.field).required = true];
}

// ImportProductResult answers an ImportProduct that was applied. A refused
// import is answered with a failed service.v1.Response.
message ImportProductResult {
  // Set when the import had a product.
  ImportedEntity product = 1 [(buf.validate.field).cel = {
    id: "import_product_result.product_without_key"
    message: "the product's result has no key"
    expression: "this.key == ''"
  }];
  // One per model of the request, in its order.
  repeated ImportedEntity models = 2 [(buf.validate.field).cel = {
    id: "import_product_result.models_keyed"
    message: "every model's result names its key, once"
    expression: "this.all(model, model.key != '') && this.map(model, model.key).unique()"
  }];
  // One per part of the request, in its order.
  repeated ImportedEntity parts = 3 [(buf.validate.field).cel = {
    id: "import_product_result.parts_keyed"
    message: "every part's result names its key, once"
    expression: "this.all(part, part.key != '') && this.map(part, part.key).unique()"
  }];
  // One per part family of the request, in its order.
  repeated ImportedEntity families = 4 [(buf.validate.field).cel = {
    id: "import_product_result.families_keyed"
    message: "every part family's result names its key, once"
    expression: "this.all(family, family.key != '') && this.map(family, family.key).unique()"
  }];
  // With PRODUCT_IMPORT_MODE_NEW_TAKES_OVER, the product that lost its
  // references to the new one (UPDATED); unset otherwise.
  ImportedEntity replaced_product = 5 [(buf.validate.field).cel = {
    id: "import_product_result.replaced_product_without_key"
    message: "the replaced product's result has no key"
    expression: "this.key == ''"
  }];
}

// ImportedEntity is what an import did with one model, part family, part or
// product: CREATED, UPDATED (a part's or family's new revision, or the
// product), or UNCHANGED (an existing model with the same content, or a part,
// family or product that matched and didn't change).
message ImportedEntity {
  string key = 1; // Empty for the product.
  string id = 2 [(buf.validate.field).required = true];
  service.v1.MutationStatus status = 3 [(buf.validate.field).enum = {
    in: [
      1,
      2,
      3
    ]
  }];
}
