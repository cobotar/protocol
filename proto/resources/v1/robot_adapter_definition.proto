syntax = "proto3";
package resources.v1;

import "buf/validate/validate.proto";
import "common/v1/catalog_status.proto";
import "resources/v1/robot_definition.proto";
import "robot/v1/robot_adapter.proto";
import "robot/v1/robot_io_catalog.proto";
import "validation/v1/predefined_string_rules.proto";

option csharp_namespace = "Messages.Resources.V1";
option go_package = "github.com/cobotar/protocol/v2/messages/resources/v1";

// RobotAdapterDefinition describes the capabilities supplied by one adapter
// implementation independently of any connected robot instance.
message RobotAdapterDefinition {
  option (buf.validate.message).cel = {
    id: "robot_adapter_definition.status_issue"
    message: "status_issue names the issue that keeps the definition from active: required unless the status is ACTIVE, and empty for ACTIVE"
    expression: "this.status == 0 || (this.status == 1) == (this.status_issue == '')"
  };

  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.robot_adapter_definition_id_component) = true
  ];
  string name = 2 [(buf.validate.field).string.(validation.v1.name_component) = true];
  string description = 3;

  // Stable implementation name reported by the adapter, e.g. "ur.rtde-dashboard".
  string adapter_type = 4 [(buf.validate.field).string.(validation.v1.adapter_type_component) = true];

  repeated RobotType supported_robot_types = 5 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];

  repeated robot.v1.RobotAdapterCommandCapability commands = 6 [(buf.validate.field).cel = {
    id: "robot_adapter_definition.commands.unique_types"
    message: "command types must be unique"
    expression: "this.map(command, command.type).unique()"
  }];

  repeated robot.v1.RobotAdapterTelemetryCapability telemetry = 7 [(buf.validate.field).cel = {
    id: "robot_adapter_definition.telemetry.unique_types"
    message: "telemetry types must be unique"
    expression: "this.map(stream, stream.type).unique()"
  }];

  // Plans of the robot's next motion that the adapter publishes.
  repeated robot.v1.RobotAdapterPlanCapability plans = 9 [(buf.validate.field).cel = {
    id: "robot_adapter_definition.plans.unique_types"
    message: "plan types must be unique"
    expression: "this.map(plan, plan.type).unique()"
  }];

  // I/O register families that an adapter configuration may expose as named signals.
  repeated robot.v1.RobotIORegisterKind configurable_io_register_kinds = 8 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // How far the definition can be relied on (cobotar/protocol#40), e.g.
  // EXPERIMENTAL while no adapter implements it yet.
  common.v1.CatalogStatus status = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The issue that keeps the definition from ACTIVE, e.g.
  // "cobotar/Authoring#5": required unless the status is ACTIVE.
  string status_issue = 11 [(buf.validate.field).string.(validation.v1.issue_reference_component) = true];
}

message RobotAdapterDefinitions {
  repeated RobotAdapterDefinition items = 1 [
    (buf.validate.field).cel = {
      id: "robot_adapter_definitions.items.unique_ids"
      message: "robot adapter definition ids must be unique"
      expression: "this.map(definition, definition.id).unique()"
    },
    (buf.validate.field).cel = {
      id: "robot_adapter_definitions.items.unique_names"
      message: "robot adapter definition names must be unique, ignoring case and surrounding whitespace"
      expression: "this.map(definition, definition.name.trim().lowerAscii()).unique()"
    },
    (buf.validate.field).cel = {
      id: "robot_adapter_definitions.items.unique_adapter_types"
      message: "robot adapter types must be unique"
      expression: "this.map(definition, definition.adapter_type).unique()"
    }
  ];
}
